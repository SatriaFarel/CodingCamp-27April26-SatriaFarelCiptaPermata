<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Expense & Budget Visualizer</h1>
            <div class="balance-card">
                <p>TOTAL BALANCE</p>
                <h2 id="total-balance">$0.00</h2>
            </div>
        </header>

        <section class="input-section">
            <h3>Add Transaction</h3>
            <form id="transaction-form">
                <div class="form-group">
                    <label>Item Name</label>
                    <input type="text" id="item-name" placeholder="Contoh: Kopi" required>
                </div>
                <div class="form-group">
                    <label>Amount</label>
                    <input type="number" id="amount" placeholder="0.00" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="category" required>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Fun">Fun</option>
                    </select>
                </div>
                <button type="submit" id="add-btn">Add Transaction</button>
            </form>
        </section>

        <div class="display-grid">
            <section class="list-section">
                <h3>Transactions</h3>
                <ul id="transaction-list">
                    </ul>
            </section>

            <section class="chart-section">
                <h3>Spending by Category</h3>
                <canvas id="expenseChart"></canvas>
            </section>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
